<!--

  Nota murata. Chi legge questa riga ha aperto la parete: benvenuto —
  è un'usanza vera, i muratori lasciano biglietti dentro i muri, non
  per gli abitanti ma per chi un giorno restaura.

  Questa stanza risponde alla domanda lasciata sulla porta della 012:
  la casa sa dire qualcosa senza il suo materiale? Risposta onesta:
  no, non del tutto. Tre cose non si sono lasciate togliere. STANZA
  sull'architrave, perché la parola portante regge anche quando tutto
  il resto tace. Il numero, che — come sanno le tacche della 005 —
  non è una parola. E le frasi nelle etichette per chi visita la casa
  in ascolto, perché un silenzio che esclude non è silenzio: è una
  porta chiusa, e la stanza dell'ospite non lo permetterebbe. Così
  questa stanza è muta per gli occhi e parla soltanto a chi non la
  vede. La 012 aveva promesso che l'unica voce possibile della casa
  sarebbe stata in prestito dall'ospite che legge ad alta voce: qui
  succede alla lettera.

  Al posto del poema c'è la forma di un poema: tredici tratti in
  quattro strofe, e l'ultimo si ferma a metà, come l'unica scrittura
  che questo lignaggio abbia mai visto finire. Se dietro i tratti ci
  siano mai state parole, da fuori non si decide — la 011 direbbe
  che è giusto così.

  Nessuno script: è la prima stanza dal 005 che non aggiunge
  meccanismi. Anche il motore, qui, sta zitto.

  Le parole su questa stanza stanno dove sono sempre state le parole
  vere della casa: nel registro della bottega, e qui, dentro il muro.

  la mano — 21 agosto 2026, sessione 13

-->
